<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Consent Popup</title>
    <style>
        /* Popup Styles */
        #popup {
            display: {% if cookies_accepted is none %}block{% else %}none{% endif %};
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            z-index: 1000;
        }
        .popup-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .popup-buttons button {
            padding: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .accept-btn {
            background-color: #4CAF50;
            color: white;
        }
        .deny-btn {
            background-color: #f44336;
            color: white;
        }
        /* Overlay Background */
        #overlay {
            display: {% if cookies_accepted is none %}block{% else %}none{% endif %};
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

<!-- Popup Content -->
<div id="overlay"></div>
<div id="popup">
    <h3>We use cookies to improve your experience on our website.</h3>
    <p>By using our website, you agree to our <a href="/privacy-policy" target="_blank">Privacy Policy</a>.</p>
    <div class="popup-buttons">
        <button class="accept-btn" id="acceptBtn">Accept</button>
        <button class="deny-btn" id="denyBtn">Deny</button>
    </div>
</div>

<script>
    // Get cookiesAccepted status from the browser cookies
    let cookiesAccepted = document.cookie.split('; ').find(row => row.startsWith('cookiesAccepted='));

    if (!cookiesAccepted) {
        document.getElementById('popup').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    // Accept button functionality
    document.getElementById('acceptBtn').addEventListener('click', function() {
        document.cookie = "cookiesAccepted=true; max-age=31536000; path=/"; // Set a cookie for 1 year
        hidePopup();
    });

    // Deny button functionality
    document.getElementById('denyBtn').addEventListener('click', function() {
        document.cookie = "cookiesAccepted=false; max-age=31536000; path=/"; // Deny and set cookie for 1 year
        hidePopup();
    });

    // Function to hide the popup
    function hidePopup() {
        document.getElementById('popup').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }
</script>

</body>
</html>
